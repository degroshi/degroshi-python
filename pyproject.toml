[project]
name = "degroshi"
version = "1.0.0b0"
description = "The official Python SDK for the Degroshi API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["attrs>=22.2.0", "httpx2>=2.13.1,<3"]
authors = [{ name = "Degroshi" }]
keywords = ["degroshi", "personal finance", "budgeting", "money", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/degroshi/degroshi-python"
Documentation = "https://docs.degroshi.com/en/developers"
Repository = "https://github.com/degroshi/degroshi-python"
Issues = "https://github.com/degroshi/degroshi-python/issues"
Changelog = "https://github.com/degroshi/degroshi-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/degroshi"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/degroshi/_generated"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
